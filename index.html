<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Requests</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e2e5ea; --accent:#2f5bea;
          --pending:#b45309; --pendingbg:#fef3c7; --ok:#166534; --okbg:#dcfce7; --bad:#991b1b; --badbg:#fee2e2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1a1f29; --ink:#e8ebf1; --muted:#9aa3b2; --line:#2b3240; --accent:#7c9cff;
          --pending:#fcd34d; --pendingbg:#3a2f0f; --ok:#86efac; --okbg:#10301c; --bad:#fca5a5; --badbg:#3b1616; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0; } h2 { font-size:16px; margin:0 0 12px; }
  main { max-width:900px; margin:24px auto; padding:0 16px; display:grid; gap:20px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:8px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  .bar { display:flex; gap:8px; align-items:center; } .bar input { width:auto; }
  .req { border-top:1px solid var(--line); padding:12px 0; } .req:first-of-type { border-top:0; }
  .row { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center; }
  .meta { color:var(--muted); font-size:13px; }
  .badge { padding:2px 10px; border-radius:99px; font-size:13px; font-weight:600; }
  .Pending { background:var(--pendingbg); color:var(--pending); } .Approved { background:var(--okbg); color:var(--ok); } .Rejected { background:var(--badbg); color:var(--bad); }
  ol.history { margin:10px 0 0; padding-left:18px; font-size:13px; color:var(--muted); }
  .actions { margin-top:10px; display:grid; gap:8px; }
  #msg { color:var(--bad); min-height:20px; margin-top:8px; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Access requests</h1>
  <div class="bar">
    <label for="role" style="margin:0">Viewing as</label>
    <select id="role"><option>Employee</option><option>Manager</option></select>
    <input id="actor" placeholder="Your name" aria-label="Your name" />
  </div>
</header>
<main>
  <section id="newSection">
    <h2>Request access</h2>
    <label for="name">Your name</label><input id="name" />
    <label for="system">System</label>
    <select id="system"><option>GitHub</option><option>AWS</option><option>Slack</option><option>Google Workspace</option></select>
    <label for="reason">Why do you need it?</label><textarea id="reason" rows="3"></textarea>
    <p><button class="primary" id="submit">Submit request</button></p>
    <div id="msg" role="alert"></div>
  </section>
  <section>
    <h2 id="listTitle">Requests</h2>
    <div id="list"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (iso) => new Date(iso).toLocaleString();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Role': $('role').value, 'X-User': $('actor').value.trim(), ...(opts.headers || {}) } });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

async function refresh() {
  const isMgr = $('role').value === 'Manager';
  $('newSection').hidden = isMgr;
  $('listTitle').textContent = isMgr ? 'All requests' : 'My requests';
  if (!isMgr && !$('actor').value.trim()) { $('list').innerHTML = '<p class="empty">Enter your name at the top to see your requests.</p>'; return; }
  try {
    const items = await api('/api/requests');
    $('list').innerHTML = items.length ? items.map((r) => card(r, isMgr)).join('') : '<p class="empty">No requests yet.</p>';
  } catch (e) { $('list').innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

function card(r, isMgr) {
  const history = r.history.map((h) => `<li>${esc(h.action)} by <b>${esc(h.by)}</b> on ${fmt(h.at)}${h.note ? ` - "${esc(h.note)}"` : ''}</li>`).join('');
  const actions = isMgr && r.status === 'Pending' ? `
    <div class="actions">
      <input id="c-${r.id}" placeholder="Reason (required to reject)" aria-label="Decision reason" />
      <div class="bar"><button class="primary" data-id="${r.id}" data-d="Approved">Approve</button>
      <button class="danger" data-id="${r.id}" data-d="Rejected">Reject</button></div>
    </div>` : '';
  return `<div class="req"><div class="row"><b>${esc(r.system)}</b><span class="badge ${r.status}">${r.status}</span></div>
    <div class="meta">${esc(r.name)} - ${fmt(r.createdAt)}</div><div>${esc(r.reason)}</div>
    <ol class="history" aria-label="History">${history}</ol>${actions}</div>`;
}

$('submit').onclick = async () => {
  $('msg').textContent = '';
  try {
    await api('/api/requests', { method: 'POST', body: JSON.stringify({ name: $('name').value, system: $('system').value, reason: $('reason').value }) });
    $('actor').value = $('name').value.trim(); $('reason').value = '';
    refresh();
  } catch (e) { $('msg').textContent = e.message; }
};

$('list').onclick = async (e) => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  try {
    await api(`/api/requests/${b.dataset.id}/decision`, { method: 'POST', body: JSON.stringify({ decision: b.dataset.d, comment: $('c-' + b.dataset.id).value }) });
    refresh();
  } catch (err) { alert(err.message); }
};

$('role').onchange = refresh; $('actor').onchange = refresh;
refresh();
</script>
</body>
</html>
